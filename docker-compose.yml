version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rehab-twin-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./backend/artifacts:/app/backend/artifacts
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rehab-twin-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
